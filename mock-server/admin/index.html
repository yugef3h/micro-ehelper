<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock Server Admin</title>
  <link rel="stylesheet" href="/__admin/style.css">
</head>
<body>
  <header id="topbar">
    <span class="logo">⚡ Mock Server Admin</span>
  </header>

  <div id="main">
    <aside id="sidebar">
      <div class="sidebar-header">
        <input type="text" id="search" placeholder="搜索接口...">
      </div>
      <nav id="file-tree"></nav>
    </aside>

    <section id="editor-panel">
      <div id="editor-toolbar">
        <span id="current-file">← 请从左侧选择接口</span>
        <span id="error-count" style="color:var(--red);font-size:11px;display:none;margin-left:8px;"></span>
      </div>
      <div id="editor-container" class="editor-split">
        <div id="source-panel">
          <div class="panel-label">源码</div>
          <div class="editor-wrapper">
            <div id="line-numbers"></div>
            <textarea id="json-editor" spellcheck="false"></textarea>
          </div>
          <div id="error-panel" style="display:none;max-height:80px;overflow-y:auto;background:#2a1a1a;border-top:1px solid var(--red);padding:4px 8px;font-size:11px;flex-shrink:0;"></div>
        </div>
        <div id="tree-panel">
          <div class="panel-label">树形编辑</div>
          <div id="tree-editor"></div>
        </div>
      </div>
    </section>
  </div>

  <footer id="preview-panel">
    <div class="preview-header">
      <span>实时预览</span>
      <div class="preview-controls">
        <select id="preview-method">
          <option>GET</option>
          <option>POST</option>
          <option>PUT</option>
          <option>DELETE</option>
        </select>
        <input type="text" id="preview-path" placeholder="/api/user_info">
        <button id="btn-send">▶ 发送</button>
      </div>
    </div>
    <pre id="preview-result">// 点击发送查看 Mock 响应</pre>
  </footer>

  <!-- State modal -->
  <div id="state-modal" class="modal" style="display:none">
    <div class="modal-content">
      <h2>全局状态 (_state.json) <small>双击标题栏打开</small></h2>
      <textarea id="state-editor" spellcheck="false"></textarea>
      <div class="modal-actions">
        <button id="btn-state-save">保存</button>
        <button id="btn-state-close">关闭</button>
      </div>
    </div>
  </div>


  <script src="/__admin/tree-editor.js"></script>
  <script src="/__admin/app.js"></script>
  <script src="/__admin/health-check.js"></script>
</body>
</html>
